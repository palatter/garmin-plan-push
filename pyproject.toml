[project]
name = "garmin-plan-push"
version = "0.1.0"
description = "Compile AI-generated running plans into Garmin structured workouts and push them to Garmin Connect."
requires-python = ">=3.12"
dependencies = [
    # >=0.3.5 closes GHSA: insecure permissions on the OAuth token store
    # (~/.garminconnect). Floor at what we actually test against.
    "garminconnect>=0.3.16",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "hypothesis>=6.100", "ruff>=0.14", "ty>=0.0.1"]

[project.scripts]
gpp = "gpp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Correctness and modernisation, not style bikeshedding: pyflakes, pycodestyle
# errors, import order, pyupgrade, bugbear, comprehensions, and the security
# checks that matter for a tool handling a password.
select = ["F", "E", "W", "I", "UP", "B", "C4", "S", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # asserts are fine; this is not a hardened server
    "S603", "S607",  # subprocess use in tests/tooling is intentional
    "SIM108", # ternaries are not always clearer
    "RUF012", # mutable class attrs on dataclass-free helpers are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B011"]  # fake keys and deliberate asserts in tests

[tool.coverage.run]
source = ["gpp"]
omit = ["gpp/web/static/*"]

[tool.coverage.report]
show_missing = false
skip_covered = true
