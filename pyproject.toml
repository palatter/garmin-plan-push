[project]
name = "garmin-plan-push"
version = "0.1.0"
description = "Compile AI-generated running plans into Garmin structured workouts and push them to Garmin Connect."
requires-python = ">=3.12"
dependencies = [
    # >=0.3.5 closes GHSA: insecure permissions on the OAuth token store
    # (~/.garminconnect). Floor at what we actually test against.
    "garminconnect>=0.3.16",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
gpp = "gpp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
