[project]
name = "garmin-plan-push"
version = "0.2.2"
description = "Compile AI-generated running plans into Garmin structured workouts and push them to Garmin Connect."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick Latter" }]
requires-python = ">=3.12"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    # >=0.3.5 closes GHSA: insecure permissions on the OAuth token store
    # (~/.garminconnect). Floor at what we actually test against; the ceiling
    # keeps a friend's `uv tool upgrade` off an untested 0.4 (the internals
    # moved within 0.3.x already; tests/test_garmin_contract.py checks them).
    "garminconnect>=0.3.16,<0.4",
    "jsonschema>=4.21",
    # The AI libraries come with every install: the guide's one-line install
    # has to be enough for someone who only pastes an API key. Floors are what
    # is tested; ceilings keep an upgrade off an untested major.
    "anthropic>=1.7,<2",
    "openai>=3.16,<4",
]

[project.optional-dependencies]
# Kept, empty, so older instructions (`--extra anthropic`) still work.
anthropic = []
openai = []
mcp = ["mcp>=2.2,<3"]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "hypothesis>=6.100", "ruff>=0.14", "ty==0.0.84"]

[project.scripts]
gpp = "gpp.cli:main"

[project.urls]
Homepage = "https://palatter.github.io/garmin-plan-push/"
Source = "https://github.com/palatter/garmin-plan-push"
Issues = "https://github.com/palatter/garmin-plan-push/issues"
Changelog = "https://github.com/palatter/garmin-plan-push/blob/main/CHANGELOG.md"

[build-system]
# 1.27 is the first to write the licence as an SPDX expression (PEP 639).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Correctness and modernisation, not style bikeshedding: pyflakes, pycodestyle
# errors, import order, pyupgrade, bugbear, comprehensions, and the security
# checks that matter for a tool handling a password.
select = ["F", "E", "W", "I", "UP", "B", "C4", "S", "SIM", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "S101",   # asserts are fine; this is not a hardened server
    "S603", "S607",  # subprocess use in tests/tooling is intentional
    "SIM108", # ternaries are not always clearer
    "RUF012", # mutable class attrs on dataclass-free helpers are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B011"]  # fake keys and deliberate asserts in tests

[tool.coverage.run]
source = ["gpp"]
omit = ["gpp/web/static/*"]

[tool.coverage.report]
show_missing = false
skip_covered = true

[tool.ty.src]
# The package is held to the checker; the tests (fakes and monkeypatching)
# are not. `uv run python scripts/check.py` runs it with everything else.
include = ["gpp"]
