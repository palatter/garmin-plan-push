name: Scorecard

# OpenSSF Scorecard: an outside check of this repository's supply-chain
# hygiene (pinned actions, branch protection, dependency updates, tokens).
# Results go to the Security tab.

on:
  push:
    branches: [main]
  schedule:
    - cron: "33 5 * * 2"

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4
        with:
          sarif_file: results.sarif
