name: Release

# Tag a version and a GitHub Release appears with the wheel and sdist
# attached, so `uv tool install` can target a version instead of main:
#
#   git tag v0.2.0 && git push origin v0.2.0
#   uv tool install "garmin-plan-push @ https://github.com/palatter/garmin-plan-push/releases/download/v0.2.0/garmin_plan_push-0.2.0-py3-none-any.whl"

on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # only this workflow may create releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7

      - name: Check the tag matches pyproject's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$tag" = "$version" || { echo "tag v$tag does not match pyproject version $version"; exit 1; }

      - name: Test
        run: uv sync --extra dev && uv run pytest -q

      - name: Build
        run: uv build

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
