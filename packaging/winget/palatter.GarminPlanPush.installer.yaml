# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
# The Windows download each release carries: gpp with its own Python, so no
# uv. packaging/winget/fill.py puts the zip's SHA-256 in; see
# packaging/README.md for the submission.
PackageIdentifier: palatter.GarminPlanPush
PackageVersion: 0.2.2
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: gpp.exe
    PortableCommandAlias: gpp
Commands:
  - gpp
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/palatter/garmin-plan-push/releases/download/v0.2.2/gpp-0.2.2-windows.zip
    InstallerSha256: ZIP_SHA256
ManifestType: installer
ManifestVersion: 1.10.0
